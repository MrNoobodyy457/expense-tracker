<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a35;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e0e0ff;
            --text-secondary: #9999cc;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --expense-color: #ef4444;
            --income-color: #10b981;
            --debt-color: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body.light-mode {
            --bg-primary: #f5f5ff;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a35;
            --text-secondary: #666699;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: var(--accent-primary);
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-value.expense { color: var(--expense-color); }
        .stat-value.income { color: var(--income-color); }
        .stat-value.balance { color: var(--accent-primary); }
        .stat-value.debt { color: var(--debt-color); }

        /* Quick Add Button */
        .quick-add-btn {
            position: fixed;
            bottom: 90px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 50%;
            font-size: 28px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .quick-add-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 24px;
            color: var(--text-primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--expense-color);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        /* Transactions List */
        .transactions-section {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .transaction-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .transaction-item:hover {
            transform: translateX(5px);
            border-color: var(--accent-primary);
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-description {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .transaction-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .transaction-amount {
            font-size: 20px;
            font-weight: 700;
            text-align: right;
        }

        .transaction-amount.expense { color: var(--expense-color); }
        .transaction-amount.income { color: var(--income-color); }
        .transaction-amount.debt { color: var(--debt-color); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Auth Section */
        .auth-section {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .auth-section h2 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 15px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 28px;
            }

            .quick-add-btn {
                bottom: 80px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Section (shown before login) -->
    <div id="authSection" class="auth-section" style="display: none;">
        <h2>Welcome Back</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="authEmail" placeholder="your.email@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="••••••••">
        </div>
        <button class="btn" onclick="handleAuth()">Sign In / Sign Up</button>
        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
            New user? Same button creates account!
        </p>
    </div>

    <!-- Main App (shown after login) -->
    <div id="mainApp" style="display: none;">
        <div class="container">
            <header>
                <h1>💰 Expense Tracker</h1>
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </header>

            <!-- Dashboard -->
            <div class="dashboard">
                <div class="stat-card">
                    <div class="stat-label">Balance</div>
                    <div class="stat-value balance" id="balanceValue">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Month</div>
                    <div class="stat-value expense" id="monthExpense">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Income</div>
                    <div class="stat-value income" id="totalIncome">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending Debts</div>
                    <div class="stat-value debt" id="totalDebt">₹0</div>
                </div>
            </div>

            <!-- Transactions -->
            <div class="transactions-section">
                <div class="section-header">
                    <h2>Recent Transactions</h2>
                    <button class="filter-btn" onclick="showFilterModal()">🔍 Filter</button>
                </div>
                <div id="transactionsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading transactions...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Add Button -->
        <button class="quick-add-btn" onclick="openModal()">+</button>

        <!-- Add Transaction Modal -->
        <div id="transactionModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Transaction</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('expense')">Expense</button>
                    <button class="tab" onclick="switchTab('income')">Income</button>
                    <button class="tab" onclick="switchTab('debt')">Debt</button>
                </div>

                <form id="transactionForm" onsubmit="addTransaction(event)">
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Category / Type</label>
                        <select id="category" required>
                            <option value="food">🍔 Food</option>
                            <option value="transport">🚗 Transport</option>
                            <option value="shopping">🛍️ Shopping</option>
                            <option value="entertainment">🎬 Entertainment</option>
                            <option value="bills">📄 Bills</option>
                            <option value="other">📦 Other</option>
                        </select>
                    </div>

                    <div class="form-group" id="personGroup" style="display: none;">
                        <label>Person</label>
                        <input type="text" id="person" placeholder="Who owes/is owed?">
                    </div>

                    <div class="form-group" id="debtDirectionGroup" style="display: none;">
                        <label>Direction</label>
                        <select id="debtDirection">
                            <option value="i_owe">I owe them</option>
                            <option value="they_owe">They owe me</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" placeholder="Optional notes..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Date & Time</label>
                        <input type="datetime-local" id="datetime" required>
                    </div>

                    <button type="submit" class="btn">Add Transaction</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // TODO: Replace with your Firebase config
        const firebaseConfig = {
          apiKey: "AIzaSyD_DuQkEGHyvbpD0y4BqSZkXA4H4zBRknQ",
          authDomain: "expense-tracker-94735.firebaseapp.com",
          projectId: "expense-tracker-94735",
          storageBucket: "expense-tracker-94735.firebasestorage.app",
          messagingSenderId: "799912028440",
          appId: "1:799912028440:web:3353b4eb9fb6a36012966d"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global variables
        window.currentUser = null;
        window.currentType = 'expense';
        window.transactions = [];

        // Auth state observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadTransactions();
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        // Auth handler
        window.handleAuth = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            try {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (signInError) {
                    if (signInError.code === 'auth/user-not-found' || signInError.code === 'auth/wrong-password') {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        throw signInError;
                    }
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        // Load transactions
        function loadTransactions() {
            const q = query(
                collection(db, `users/${window.currentUser.uid}/transactions`),
                orderBy('timestamp', 'desc')
            );

            onSnapshot(q, (snapshot) => {
                window.transactions = [];
                snapshot.forEach((doc) => {
                    window.transactions.push({ id: doc.id, ...doc.data() });
                });
                updateDashboard();
                renderTransactions();
            });
        }

        // Update dashboard
        function updateDashboard() {
            let totalIncome = 0;
            let totalExpenses = 0;
            let totalDebt = 0;
            let monthExpenses = 0;

            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            window.transactions.forEach(t => {
                const amount = parseFloat(t.amount);
                const tDate = t.timestamp?.toDate() || new Date(t.datetime);

                if (t.type === 'income') {
                    totalIncome += amount;
                } else if (t.type === 'expense') {
                    totalExpenses += amount;
                    if (tDate.getMonth() === currentMonth && tDate.getFullYear() === currentYear) {
                        monthExpenses += amount;
                    }
                } else if (t.type === 'debt' && t.debtDirection === 'they_owe') {
                    totalDebt += amount;
                }
            });

            document.getElementById('balanceValue').textContent = `₹${(totalIncome - totalExpenses).toFixed(2)}`;
            document.getElementById('monthExpense').textContent = `₹${monthExpenses.toFixed(2)}`;
            document.getElementById('totalIncome').textContent = `₹${totalIncome.toFixed(2)}`;
            document.getElementById('totalDebt').textContent = `₹${totalDebt.toFixed(2)}`;
        }

        // Render transactions
        function renderTransactions() {
            const container = document.getElementById('transactionsList');
            
            if (window.transactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>No transactions yet. Add your first one!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = window.transactions.map(t => {
                const date = t.timestamp?.toDate() || new Date(t.datetime);
                const dateStr = date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                const timeStr = date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-description">${t.description || t.category}</div>
                            <div class="transaction-meta">
                                ${dateStr} at ${timeStr} • ${t.category}
                                ${t.person ? ` • ${t.person}` : ''}
                            </div>
                        </div>
                        <div class="transaction-amount ${t.type}">
                            ${t.type === 'expense' ? '-' : '+'}₹${parseFloat(t.amount).toFixed(2)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Add transaction
        window.addTransaction = async (e) => {
            e.preventDefault();

            const transactionData = {
                type: window.currentType,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                datetime: document.getElementById('datetime').value,
                timestamp: serverTimestamp()
            };

            if (window.currentType === 'debt') {
                transactionData.person = document.getElementById('person').value;
                transactionData.debtDirection = document.getElementById('debtDirection').value;
            }

            try {
                await addDoc(collection(db, `users/${window.currentUser.uid}/transactions`), transactionData);
                closeModal();
                document.getElementById('transactionForm').reset();
            } catch (error) {
                alert('Error adding transaction: ' + error.message);
            }
        };

        // Export functions to window
        window.loadTransactions = loadTransactions;
        window.updateDashboard = updateDashboard;
        window.renderTransactions = renderTransactions;
    </script>

    <script>
        // Set default datetime to now
        document.getElementById('datetime').value = new Date().toISOString().slice(0, 16);

        // Modal functions
        function openModal() {
            document.getElementById('transactionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('transactionModal').classList.remove('active');
        }

        function switchTab(type) {
            window.currentType = type;
            
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Show/hide debt-specific fields
            const personGroup = document.getElementById('personGroup');
            const debtDirectionGroup = document.getElementById('debtDirectionGroup');
            
            if (type === 'debt') {
                personGroup.style.display = 'block';
                debtDirectionGroup.style.display = 'block';
                document.getElementById('person').required = true;
            } else {
                personGroup.style.display = 'none';
                debtDirectionGroup.style.display = 'none';
                document.getElementById('person').required = false;
            }

            // Update category options based on type
            const categorySelect = document.getElementById('category');
            if (type === 'income') {
                categorySelect.innerHTML = `
                    <option value="parents">👨‍👩‍👦 Parents</option>
                    <option value="friends">👥 Friends</option>
                    <option value="refund">💰 Refund</option>
                    <option value="other">📦 Other</option>
                `;
            } else {
                categorySelect.innerHTML = `
                    <option value="food">🍔 Food</option>
                    <option value="transport">🚗 Transport</option>
                    <option value="shopping">🛍️ Shopping</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="bills">📄 Bills</option>
                    <option value="other">📦 Other</option>
                `;
            }
        }

        function showFilterModal() {
            alert('Filter feature coming soon! For now, all transactions are shown.');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.querySelector('.theme-toggle');
            icon.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        // Load theme preference
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }

        // Close modal on outside click
        document.getElementById('transactionModal').addEventListener('click', (e) => {
            if (e.target.id === 'transactionModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
